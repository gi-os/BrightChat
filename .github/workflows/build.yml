name: Build & Release APK

# Same shape as the other gi-os/Light* repos: every push to the integration branch
# builds, signs, verifies and publishes one APK, which is what Obtainium watches.
# Unlike those repos the keystore is not committed — it comes from repo secrets.
# `develop` only. `main` was on this list too, while sitting 66 commits behind develop — so any
# push to it, accidental or otherwise, would have cut a signed release from July's code that
# BrightMarket immediately offers as an update to everyone. `main` is now the same commit as
# develop and is not a trigger.
on:
  push:
    branches: [develop]
    paths-ignore:
      - '**.md'
  workflow_dispatch:

permissions:
  contents: write   # needed to create the Release
  packages: read

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      # Resolving light-common from GitHub Packages, which has no anonymous read. The runner
      # exports GITHUB_ACTOR but not GITHUB_TOKEN, so the token has to be handed in. GPR_* wins
      # if set, for the case where a repo-scoped token is not accepted for another repo's package.
      GPR_USER: ${{ secrets.GPR_USER }}
      GPR_TOKEN: ${{ secrets.GPR_TOKEN }}
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-java@c1e323688fd81a25caa38c78aa6df2d33d3e20d9 # v4.8.0
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3.2.2
        with:
          packages: ''
      - uses: gradle/actions/setup-gradle@748248ddd2a24f49513d8f472f81c3a07d4d50e1 # v4.4.4

      # versionCode is the workflow run number, so every push produces a newer build
      # and `adb install -r` (and Obtainium) upgrade in place instead of erroring.
      - name: Stamp version
        id: ver
        run: |
          RUN=${{ github.run_number }}
          BASE=$(grep 'versionName' app/build.gradle.kts | head -1 | sed -E 's/.*"([0-9]+\.[0-9]+).*"/\1/')
          VERSION="${BASE}.${RUN}"
          sed -i -E "s/versionCode = .*/versionCode = ${RUN}/" app/build.gradle.kts
          sed -i -E "s/versionName = \".*\"/versionName = \"${VERSION}\"/" app/build.gradle.kts
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          grep -E 'versionCode|versionName' app/build.gradle.kts

      # Mandatory, never a fallback: an APK signed with the runner's throwaway debug
      # keystore installs once and then fails every later update with an opaque
      # "Failure: Invalid". app/build.gradle.kts also fails the build if this file is
      # missing while CI is set, so a broken secret can't publish a bad APK.
      - name: Decode keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo '::error::KEYSTORE_BASE64 is not set; refusing to build an unsigned APK'
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 --decode > lightchat-release.jks
          cat > keystore.properties <<EOF
          storeFile=../lightchat-release.jks
          storePassword=${STORE_PASSWORD}
          keyAlias=${KEY_ALIAS}
          keyPassword=${KEY_PASSWORD}
          EOF

      # Before the APKs, so a failing test stops the release rather than being noticed after
      # Obtainium has already installed it.
      - name: Unit tests
        run: |
          chmod +x ./gradlew
          ./gradlew :app:testDebugUnitTest --stacktrace

      - name: Build APKs
        run: |
          chmod +x ./gradlew
          ./gradlew :app:assembleDebug :app:assembleRelease --stacktrace
        env:
          # Shake-to-report posts issues with this. Absent, the build still works —
          # reports queue on the phone until a build that has the key installs over it.
          REPORT_TOKEN: ${{ secrets.REPORT_TOKEN }}
          # The GIF search key the app ships with. Absent, the build still works — GIF search is
          # then off until somebody puts their own key in Settings. Never in the repository: this
          # one is public. See app/build.gradle.kts.
          KLIPY_KEY: ${{ secrets.KLIPY_KEY }}

      - name: Collect APK
        run: |
          V=${{ steps.ver.outputs.version }}
          mkdir -p out debugout
          cp app/build/outputs/apk/release/app-release.apk "out/LightChat-v$V.apk"
          cp app/build/outputs/apk/debug/app-debug.apk "debugout/LightChat-v$V-debug.apk"
          ls -la out debugout

      # Android identifies an app by (packageName, signing cert). If the cert ever
      # changes, Obtainium updates fail with that same "Failure: Invalid", so pin it.
      - name: Verify signing certificate
        run: |
          APKSIGNER=$(find "$ANDROID_HOME/build-tools" -name apksigner | sort -V | tail -1)
          ACTUAL=$("$APKSIGNER" verify --print-certs out/*.apk \
            | grep -i 'SHA-256 digest' | head -1 | sed -E 's/.*[Dd]igest:[[:space:]]*//' | tr -d ' ')
          EXPECTED=$(tr -d ' :\n' < signing-fingerprint.txt | tr 'A-F' 'a-f')
          echo "expected $EXPECTED"
          echo "actual   $ACTUAL"
          [ "$ACTUAL" = "$EXPECTED" ] || { echo '::error::signing certificate drifted'; exit 1; }

      # AGP shortens resource paths in release builds, so ic_launcher.png is renamed
      # to something like res/AB.png inside the zip. Ask the package what its icon is
      # instead of grepping filenames — the same lookup Obtainium and the launcher do.
      - name: Verify launcher icon is present
        run: |
          AAPT2=$(find "$ANDROID_HOME/build-tools" -name aapt2 | sort -V | tail -1)
          "$AAPT2" dump badging out/*.apk > badging.txt
          grep -E "^(application:|application-icon-)" badging.txt
          grep -qE "^application:.*icon='[^']+'" badging.txt \
            || { echo '::error::package declares no launcher icon'; exit 1; }

      - name: Upload release APK artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: LightChat-apk
          path: out/*.apk
          if-no-files-found: error

      # Debug stays an artifact and is never published: Obtainium picks whatever asset
      # it finds, and two APKs per release is how it ends up installing the wrong one.
      - name: Upload debug APK artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: LightChat-debug-apk
          path: debugout/*.apk
          if-no-files-found: error

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2.6.2
        with:
          tag_name: v${{ steps.ver.outputs.version }}
          name: LightChat v${{ steps.ver.outputs.version }}
          files: out/LightChat-v${{ steps.ver.outputs.version }}.apk
          generate_release_notes: true
          make_latest: true
          fail_on_unmatched_files: true

      # Tell the index a release exists instead of waiting for its cron. GitHub
      # schedules are best-effort -- observed 70 minutes apart against a 15
      # minute schedule -- so without this a new release can sit uncatalogued
      # for over an hour and simply not appear as an update.
      - name: Ping the index
        if: success()
        continue-on-error: true
        run: |
          curl -sf -X POST \
            -H "Authorization: Bearer ${{ secrets.INDEX_DISPATCH_TOKEN }}" \
            -H "Accept: application/vnd.github+json" \
            https://api.github.com/repos/gi-os/brightmarket-index/dispatches \
            -d "{\"event_type\":\"app-released\"}" \
          || echo "index ping failed; the hourly cron will pick this up"
